version: '3.8'

services:
  database:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    container_name: skinvoice_db
    restart: always
    ports:
      - '5440:5432'
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-skinvoice}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - database_data:/var/lib/postgresql/data:rw

volumes:
  database_data:
    driver: local